name: Fork Sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Create fork/vX.Y.Z from latest upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check token
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [ -z "$FORK_SYNC_TOKEN" ]; then
            echo "::error::Missing secret FORK_SYNC_TOKEN"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Fetch upstream releases
        run: |
          git remote add upstream https://github.com/cheaper-inference/OmniRoute.git
          git fetch --no-tags upstream '+refs/heads/release/*:refs/remotes/upstream/release/*'

      - name: Create branch for the latest release
        id: sync
        run: |
          git config user.name "Sticky0"
          git config user.email "isaacsanz@proton.me"

          LATEST=$(git for-each-ref --format='%(refname:short)' 'refs/remotes/upstream/release/' \
            | grep -E '^upstream/release/v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          VERSION=${LATEST#upstream/release/}
          NEW="fork/$VERSION"
          echo "Latest upstream release: $VERSION"

          if git show-ref --verify --quiet "refs/remotes/origin/$NEW"; then
            echo "$NEW already exists"
            exit 0
          fi

          PREV=$(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/fork/' \
            | grep -E '^origin/fork/v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          BASE=${PREV:-origin/release/v3.8.54}
          echo "Base for own commits: $BASE"

          COMMITS=$(git rev-list --reverse --no-merges "$BASE" --not --remotes=upstream)
          echo "Own commits:"
          git log --oneline $COMMITS

          git checkout -q -B "$NEW" "$LATEST"
          for C in $COMMITS; do
            if git cherry-pick "$C"; then continue; fi
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            if [ "$CONFLICTS" = "README.md" ]; then
              git checkout --theirs README.md
              git add README.md
              GIT_EDITOR=true git cherry-pick --continue
            else
              echo "::error::Conflict in: $CONFLICTS (commit $C)"
              git cherry-pick --abort
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              echo "latest=$VERSION" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          done

          git push origin "$NEW"

      - name: Open issue on conflict
        if: failure() && steps.sync.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Fork sync conflict with ${{ steps.sync.outputs.latest }}" \
            --body "Cherry-pick of own commits onto upstream ${{ steps.sync.outputs.latest }} had conflicts. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Resolve it locally."
