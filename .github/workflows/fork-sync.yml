name: Fork Sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Rebase fork branch on latest upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check token
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [ -z "$FORK_SYNC_TOKEN" ]; then
            echo "::error::Missing secret FORK_SYNC_TOKEN"
            exit 1
          fi

      - name: Checkout fork branch
        uses: actions/checkout@v7
        with:
          ref: fork
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Fetch upstream releases
        run: |
          git remote add upstream https://github.com/cheaper-inference/OmniRoute.git
          git fetch --no-tags upstream '+refs/heads/release/*:refs/remotes/upstream/release/*'

      - name: Rebase on latest release
        id: rebase
        run: |
          git config user.name "Sticky0"
          git config user.email "isaacsanz@proton.me"

          LATEST=$(git for-each-ref --format='%(refname:short)' 'refs/remotes/upstream/release/' \
            | grep -E '^upstream/release/v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "Latest upstream release: $LATEST"

          if git merge-base --is-ancestor "$LATEST" HEAD; then
            echo "Already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMITS=$(git rev-list --reverse HEAD --not --remotes=upstream)
          echo "Own commits:"
          git log --oneline $COMMITS

          git checkout -q -B rebased "$LATEST"
          for C in $COMMITS; do
            if git cherry-pick "$C"; then continue; fi
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            if [ "$CONFLICTS" = "README.md" ]; then
              git checkout --theirs README.md
              git add README.md
              GIT_EDITOR=true git cherry-pick --continue
            else
              echo "::error::Conflict in: $CONFLICTS (commit $C)"
              git cherry-pick --abort
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          done

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Push
        if: steps.rebase.outputs.changed == 'true'
        run: git push --force-with-lease=fork origin rebased:fork

      - name: Open issue on conflict
        if: failure() && steps.rebase.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Fork sync conflict with ${{ steps.rebase.outputs.latest }}" \
            --body "Rebase of branch fork onto ${{ steps.rebase.outputs.latest }} had conflicts. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Resolve it locally."
